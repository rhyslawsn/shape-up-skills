name: Test skills

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y graphviz ripgrep fontconfig
      - name: Python packages
        run: |
          pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Run every skill's code
        run: python tests/run_skill_code.py
